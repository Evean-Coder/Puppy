# Render Blueprint：纯静态站，不需要构建、不需要服务端
# 仓库连上 Render 后会自动读到这份配置。
# 也可以在 Render 控制台手填：Build Command 留空，Publish Directory 填 site
services:
  - type: web
    name: shiba-course-assistant
    runtime: static
    staticPublishPath: ./site
    headers:
      # 页面每次刷新都取最新版，避免 CDN 缓存住旧内容
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # 视频与幻灯片内容不变，长缓存（换片时文件名要一起换）
      - path: /media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
